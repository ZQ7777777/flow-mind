server:
  address: 127.0.0.1
  port: 8081

flow-mind:
  platform:
    enabled: true
    sqlite:
      path: ./data/business-flow.db
    mock:
      enabled: false
    callback:
      async-enabled: true
    timeout-scan:
      enabled: false
  business: {}

server.servlet.session:
  timeout: 30m
  cookie:
    http-only: true
    same-site: lax
    path: /
